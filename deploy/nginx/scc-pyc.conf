# St. Cecilia Catholic Church — Parish Youth Council (SCC-PYC)
# Ubuntu LTS Nginx Production Virtual Host (Spec Section 15.1)

server {
    listen 80;
    listen [::]:80;
    server_name pyc.stceciliaparish.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pyc.stceciliaparish.org;

    root /var/www/scc-pyc/public;
    index index.php;

    charset utf-8;
    client_max_body_size 10M;

    # TLS 1.2 / 1.3 Certificates (Let's Encrypt / Certbot)
    ssl_certificate     /etc/letsencrypt/live/pyc.stceciliaparish.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pyc.stceciliaparish.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Block access to dotfiles (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
