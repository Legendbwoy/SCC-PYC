; St. Cecilia Parish Youth Council — Dedicated Priority Queue Workers (Spec Section 10.13 & 15.3)
; Bulk campaigns run on a separate worker pool so payment receipts and 2FA invitations are never delayed.

[program:scc-pyc-high-priority]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/scc-pyc/artisan queue:work --queue=high_priority,default --sleep=1 --tries=6 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/scc-pyc/storage/logs/worker-high-priority.log
stopwaitsecs=120

[program:scc-pyc-notifications]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/scc-pyc/artisan queue:work --queue=notifications,delivery_webhooks --sleep=2 --tries=6 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/scc-pyc/storage/logs/worker-notifications.log
stopwaitsecs=120

[program:scc-pyc-bulk]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/scc-pyc/artisan queue:work --queue=bulk_notifications --sleep=3 --tries=6 --max-time=3600 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/scc-pyc/storage/logs/worker-bulk.log
stopwaitsecs=150

[group:scc-pyc]
programs=scc-pyc-high-priority,scc-pyc-notifications,scc-pyc-bulk
